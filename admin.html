<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Use Marujo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 600px;
            margin: 30px auto 40px;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #d4af37;
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px 20px;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #d4af37;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #d4af37;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .status-msg {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }

        /* Painel de Fotos Organizado */
        .preview-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .foto-preview-card {
            position: relative;
            width: 110px;
            background: #1a1a1a;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 6px;
            text-align: center;
        }

        .foto-preview-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
        }

        .foto-tag {
            font-size: 11px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 5px;
        }

        .foto-acoes {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
        }

        .foto-acoes button {
            background: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .foto-acoes button:hover {
            background: #d4af37;
            color: #000;
        }

        .btn-remove {
            background: #ff4d4d !important;
            color: white !important;
        }

        /* Estilos do Painel de Gerenciamento CRUD */
        .categoria-section {
            margin-bottom: 30px;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .categoria-section h3 {
            color: #d4af37;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .admin-carrossel {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .admin-carrossel::-webkit-scrollbar {
            height: 8px;
        }

        .admin-carrossel::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 4px;
        }

        .admin-card {
            min-width: 160px;
            background: #2b2b2b;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .admin-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 5px;
        }

        .admin-card-info h4 {
            font-size: 14px;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .admin-card-info p {
            color: #d4af37;
            font-weight: bold;
            font-size: 13px;
        }

        .admin-card-acoes {
            display: flex;
            justify-content: space-between;
            gap: 5px;
            margin-top: auto;
        }

        .btn-acao {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .btn-editar {
            background: #d4af37;
            color: #000;
        }

        .btn-excluir {
            background: #ff4d4d;
            color: #fff;
        }

        .admin-card-ordem {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
        }

        .admin-card-ordem button {
            background: #444;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .admin-card-ordem button:hover {
            background: #d4af37;
            color: black;
        }
    </style>
</head>

<body>

    <!-- ========================================== -->
    <!-- 1. TELA DE LOGIN (Exibida quando NÃO autenticado) -->
    <!-- ========================================== -->
    <div id="painel-login" class="login-box">
        <h2 style="text-align: center; margin-bottom: 20px; color: #d4af37;">
            <i class="fa-solid fa-lock"></i> Painel Restrito
        </h2>
        <form id="form-login">
            <div class="form-group">
                <label>E-mail do Administrador</label>
                <input type="email" id="login-email" required placeholder="admin@usemarujo.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="login-senha" required placeholder="******">
            </div>
            <button type="submit" id="btn-entrar" class="btn"
                style="width: 100%; background: #d4af37; color: black; font-weight: bold; padding: 12px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;">
                Entrar no Painel
            </button>
            <p id="login-erro"
                style="color: #ff4d4d; margin-top: 12px; font-size: 14px; text-align: center; margin-bottom: 0;"></p>
        </form>
    </div>

    <!-- ========================================== -->
    <!-- 2. PAINEL ADMIN (Exibido APENAS quando autenticado) -->
    <!-- ========================================== -->
    <div id="painel-admin" style="display: none;">

        <!-- Barra Superior com Logout -->
        <div
            style="max-width: 1000px; margin: 20px auto 0; display: flex; justify-content: space-between; align-items: center; padding: 0 10px;">
            <span style="color: #d4af37; font-weight: bold; font-size: 18px;"><i class="fa-solid fa-anchor"></i> USE
                MARUJO - Painel Admin</span>
            <button id="btn-logout"
                style="background: #ff4d4d; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                <i class="fa-solid fa-right-from-bracket"></i> Sair
            </button>
        </div>

        <!-- Formulário de Cadastro e Edição -->
        <div class="admin-container">
            <h2 id="form-titulo-main"><i class="fa-solid fa-plus-circle"></i> Cadastrar Novo Produto</h2>
            <form id="admin-form">
                <div class="form-group">
                    <label>Título do Produto</label>
                    <input type="text" id="titulo" placeholder="Ex: Camisa Dior Cinza" required>
                </div>

                <div class="form-group">
                    <label>Preço (R$)</label>
                    <input type="number" step="0.01" id="precoNum" placeholder="Ex: 79.90" required>
                </div>

                <div class="form-group">
                    <label>Categoria</label>
                    <select id="categoria" required>
                        <option value="camisas">Camisas</option>
                        <option value="blusas">Casacos e Blusas</option>
                        <option value="calcasebermudas">Calças e Bermudas</option>
                        <option value="moda-infantil">Moda Infantil</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Filtros / Tags (separados por vírgula)</label>
                    <input type="text" id="filtros" placeholder="Ex: dior, lançamento">
                </div>

                <div class="form-group">
                    <label>Tamanhos Disponíveis</label>
                    <input type="text" id="tamanhos" placeholder="Ex: P, M, G, GG">
                </div>

                <div class="form-group">
                    <label>Descrição</label>
                    <textarea id="descricao" rows="3" placeholder="Descrição detalhada do produto..."></textarea>
                </div>

                <div class="form-group">
                    <label>Fotos do Produto (Máximo 5 fotos)</label>
                    <input type="file" id="fotos-input" accept="image/*" multiple style="display: none;">

                    <button type="button" id="btn-add-foto" class="btn"
                        style="background-color: #333; color: #d4af37; border: 1px solid #d4af37; cursor: pointer; padding: 10px; width: 100%; border-radius: 5px;">
                        📸 Selecionar Fotos (Até 5)
                    </button>

                    <div id="preview-container" class="preview-container"></div>
                </div>

                <button type="submit" id="btn-salvar" class="btn btn-gold btn-block"
                    style="width: 100%; padding: 12px; background: #d4af37; color: black; font-weight: bold; border: none; border-radius: 5px; cursor: pointer;">Salvar
                    no Firestore</button>
            </form>
            <div id="status" class="status-msg"></div>
        </div>

        <!-- Painel de Gerenciamento CRUD e Reordenação -->
        <div class="admin-container gerenciamento-container" style="margin-top: 40px; max-width: 1000px;">
            <div
                style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;">
                <h2 style="margin: 0;"><i class="fa-solid fa-boxes-stacked"></i> Gerenciar Produtos Cadastrados</h2>
                <button id="btn-salvar-ordem" class="btn"
                    style="background: #25D366; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: not-allowed; opacity: 0.5;"
                    disabled>
                    ✔️ Ordem Salva
                </button>
            </div>
            <div id="carrosseis-admin">
                <!-- Os carrosséis serão injetados aqui -->
            </div>
        </div>

    </div>

    <!-- ========================================== -->
    <!-- SCRIPT FIREBASE & LÓGICA DO PAINEL -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDhOdVX9pxPzOpfOJZfsfjfjh_N0AUPA9k",
            authDomain: "usemarujo-bb701.firebaseapp.com",
            projectId: "usemarujo-bb701",
            storageBucket: "usemarujo-bb701.firebasestorage.app",
            messagingSenderId: "268367201875",
            appId: "1:268367201875:web:368ca1268dcd4b92bfa8a6",
            measurementId: "G-5YTJTJC80L"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);

        // Função para limpar o cache dos clientes quando o admin fizer alterações
        function invalidarCacheLoja() {
            localStorage.removeItem("usemarujo_produtos_cache");
            localStorage.removeItem("usemarujo_produtos_time");
        }

        // ==========================================
        // SISTEMA DE LOGIN E SEGURANÇA DA TELA
        // ==========================================
        const painelLogin = document.getElementById("painel-login");
        const painelAdmin = document.getElementById("painel-admin");
        const formLogin = document.getElementById("form-login");
        const loginErro = document.getElementById("login-erro");
        const btnLogout = document.getElementById("btn-logout");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                painelLogin.style.display = "none";
                painelAdmin.style.display = "block";
                carregarProdutosAdmin();
            } else {
                painelLogin.style.display = "block";
                painelAdmin.style.display = "none";
            }
        });

        if (formLogin) {
            formLogin.addEventListener("submit", async (e) => {
                e.preventDefault();
                loginErro.innerText = "";
                const email = document.getElementById("login-email").value;
                const senha = document.getElementById("login-senha").value;

                try {
                    await signInWithEmailAndPassword(auth, email, senha);
                    formLogin.reset();
                } catch (error) {
                    console.error("Erro ao entrar:", error);
                    loginErro.innerText = "E-mail ou senha incorretos.";
                }
            });
        }

        if (btnLogout) {
            btnLogout.addEventListener("click", () => {
                signOut(auth);
            });
        }

        // ==========================================
        // VARIÁVEIS GLOBAIS DE PRODUTOS E FOTOS
        // ==========================================
        let listaFotos = []; // Armazena URLs públicas das imagens
        let produtoEditandoId = null;
        let produtosCarregados = [];
        let ordemAlterada = false;

        const fotosInput = document.getElementById("fotos-input");
        const btnAddFoto = document.getElementById("btn-add-foto");
        const previewContainer = document.getElementById("preview-container");
        const form = document.getElementById("admin-form");
        const btnSalvar = document.getElementById("btn-salvar");

        // ==========================================
        // GERENCIAMENTO E UPLOAD DE FOTOS (STORAGE)
        // ==========================================
        btnAddFoto.addEventListener("click", () => fotosInput.click());

        // Compacta a imagem antes do upload (Gera Blob WebP leve)
        function compressImageToBlob(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => resolve(blob), 'image/webp', quality);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        // Envia o arquivo para o Firebase Storage e retorna a URL pública
        async function uploadFotoStorage(file) {
            const blob = await compressImageToBlob(file);
            const nomeLimpo = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
            const nomeArquivo = `produtos/${Date.now()}_${nomeLimpo}.webp`;
            const storageRef = ref(storage, nomeArquivo);
            await uploadBytes(storageRef, blob);
            return await getDownloadURL(storageRef);
        }

        fotosInput.addEventListener("change", async (e) => {
            const files = Array.from(e.target.files);
            if (listaFotos.length + files.length > 5) {
                alert("Atenção: O limite máximo é de 5 fotos por produto.");
                fotosInput.value = "";
                return;
            }

            const statusEl = document.getElementById("status");
            statusEl.style.color = "#d4af37";

            try {
                for (let i = 0; i < files.length; i++) {
                    statusEl.innerText = `Enviando foto ${i + 1} de ${files.length} para o servidor...`;
                    const url = await uploadFotoStorage(files[i]);
                    listaFotos.push(url);
                }
                statusEl.innerText = "Upload das fotos concluído com sucesso!";
                statusEl.style.color = "#25D366";
            } catch (err) {
                console.error("Erro no upload:", err);
                statusEl.style.color = "#ff4d4d";
                statusEl.innerText = "Erro ao enviar foto: " + err.message;
            } finally {
                fotosInput.value = "";
                renderizarPreview();
            }
        });

        function renderizarPreview() {
            previewContainer.innerHTML = "";
            listaFotos.forEach((fotoUrl, index) => {
                const card = document.createElement("div");
                card.className = "foto-preview-card";
                card.innerHTML = `
                <div class="foto-tag">${index === 0 ? "1ª (Capa)" : `${index + 1}ª Foto`}</div>
                <img src="${fotoUrl}" alt="Foto ${index + 1}" loading="lazy">
                <div class="foto-acoes">
                    ${index > 0 ? `<button type="button" onclick="moverFotoForm(${index}, -1)">⬅️</button>` : '<span></span>'}
                    <button type="button" class="btn-remove" onclick="removerFotoForm(${index})">❌</button>
                    ${index < listaFotos.length - 1 ? `<button type="button" onclick="moverFotoForm(${index}, 1)">➡️</button>` : '<span></span>'}
                </div>
            `;
                previewContainer.appendChild(card);
            });
        }

        window.moverFotoForm = function (index, direcao) {
            const novoIndex = index + direcao;
            if (novoIndex >= 0 && novoIndex < listaFotos.length) {
                const itemRemovido = listaFotos.splice(index, 1)[0];
                listaFotos.splice(novoIndex, 0, itemRemovido);
                renderizarPreview();
            }
        };

        window.removerFotoForm = function (index) {
            listaFotos.splice(index, 1);
            renderizarPreview();
        };

        // ==========================================
        // SALVAR OU ATUALIZAR PRODUTO
        // ==========================================
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const statusEl = document.getElementById("status");

            if (listaFotos.length === 0) {
                alert("Adicione pelo menos 1 foto para o produto.");
                return;
            }

            btnSalvar.disabled = true;
            statusEl.style.color = "#d4af37";
            statusEl.innerText = produtoEditandoId ? "Atualizando produto..." : "Salvando novo produto...";

            try {
                const titulo = document.getElementById("titulo").value;
                const precoVal = parseFloat(document.getElementById("precoNum").value);
                const categoria = document.getElementById("categoria").value;
                const descricao = document.getElementById("descricao").value;
                const tamanhos = document.getElementById("tamanhos").value;
                const rawFiltros = document.getElementById("filtros").value.split(",").map(f => f.trim().toLowerCase()).filter(f => f);
                const filtros = ["todos", ...rawFiltros];

                const produtoDados = {
                    titulo,
                    precoNum: precoVal,
                    preco: `R$ ${precoVal.toFixed(2).replace(".", ",")}`,
                    categoria,
                    filtros,
                    descricao,
                    tamanhos,
                    fotos: listaFotos,
                    mensagemZap: `Olá! Tenho interesse no(a) ${titulo} que vi no site da Use Marujo.`
                };

                if (produtoEditandoId) {
                    await updateDoc(doc(db, "produtos", produtoEditandoId), produtoDados);
                    statusEl.innerText = "Produto atualizado com sucesso!";
                    produtoEditandoId = null;
                    btnSalvar.innerText = "Salvar no Firestore";
                } else {
                    produtoDados.criadoEm = new Date();
                    produtoDados.ordem = Date.now();
                    await addDoc(collection(db, "produtos"), produtoDados);
                    statusEl.innerText = "Produto cadastrado com sucesso!";
                }

                invalidarCacheLoja(); // Garante atualização para os visitantes da loja

                statusEl.style.color = "#25D366";
                form.reset();
                listaFotos = [];
                renderizarPreview();
                carregarProdutosAdmin();
            } catch (err) {
                console.error(err);
                statusEl.style.color = "#ff4d4d";
                statusEl.innerText = "Erro: " + err.message;
            } finally {
                btnSalvar.disabled = false;
            }
        });

        // ==========================================
        // LISTAGEM, EDIÇÃO, EXCLUSÃO E ORDENAÇÃO
        // ==========================================
        async function carregarProdutosAdmin() {
            const carrosseisDiv = document.getElementById("carrosseis-admin");
            carrosseisDiv.innerHTML = "<p>Carregando produtos...</p>";

            try {
                const querySnapshot = await getDocs(collection(db, "produtos"));
                produtosCarregados = [];

                querySnapshot.forEach((docSnap) => {
                    produtosCarregados.push({ id: docSnap.id, ...docSnap.data() });
                });

                produtosCarregados.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

                ordemAlterada = false;
                atualizarBotaoSalvarOrdem();
                renderizarListaProdutosAdmin();

            } catch (error) {
                console.error("Erro ao carregar lista:", error);
                carrosseisDiv.innerHTML = `<p style="color: #ff4d4d;">Erro ao carregar produtos do Firestore.</p>`;
            }
        }

        function renderizarListaProdutosAdmin() {
            const carrosseisDiv = document.getElementById("carrosseis-admin");
            carrosseisDiv.innerHTML = "";

            const categoriasFiltro = {
                "camisas": "Camisas",
                "blusas": "Casacos e Blusas",
                "calcasebermudas": "Calças e Bermudas",
                "moda-infantil": "Moda Infantil"
            };

            Object.keys(categoriasFiltro).forEach(catId => {
                const produtosCategoria = produtosCarregados.filter(p => p.categoria === catId);

                if (produtosCategoria.length > 0) {
                    const sec = document.createElement("div");
                    sec.className = "categoria-section";

                    let cardsHTML = produtosCategoria.map((p, index) => {
                        const imagemCapa = (p.fotos && p.fotos.length > 0) ? p.fotos[0] : "https://via.placeholder.com/160x160?text=Sem+Foto";
                        const tituloProd = p.titulo || "Sem título";
                        const precoProd = p.preco || "R$ 0,00";

                        return `
                        <div class="admin-card">
                            <img src="${imagemCapa}" alt="${tituloProd}" loading="lazy">
                            <div class="admin-card-info">
                                <h4>${tituloProd}</h4>
                                <p>${precoProd}</p>
                            </div>
                            <div class="admin-card-acoes">
                                <button type="button" class="btn-acao btn-editar" onclick="carregarParaEdicao('${p.id}')"><i class="fas fa-edit"></i> Editar</button>
                                <button type="button" class="btn-acao btn-excluir" onclick="deletarProduto('${p.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                            <div class="admin-card-ordem">
                                <button type="button" onclick="moverPosicaoProdutoLocal('${p.id}', -1)" ${index === 0 ? 'disabled style="opacity: 0.3"' : ''}>⬅️</button>
                                <button type="button" onclick="moverPosicaoProdutoLocal('${p.id}', 1)" ${index === produtosCategoria.length - 1 ? 'disabled style="opacity: 0.3"' : ''}>➡️</button>
                            </div>
                        </div>
                    `;
                    }).join('');

                    sec.innerHTML = `
                    <h3>${categoriasFiltro[catId]}</h3>
                    <div class="admin-carrossel">
                        ${cardsHTML}
                    </div>
                `;
                    carrosseisDiv.appendChild(sec);
                }
            });
        }

        window.moverPosicaoProdutoLocal = function (produtoId, direcao) {
            const indexGeral = produtosCarregados.findIndex(p => p.id === produtoId);
            if (indexGeral === -1) return;

            const prodAtual = produtosCarregados[indexGeral];
            const produtosCategoria = produtosCarregados.filter(p => p.categoria === prodAtual.categoria);
            const indexNaCategoria = produtosCategoria.findIndex(p => p.id === produtoId);
            const indexVizinho = indexNaCategoria + direcao;

            if (indexVizinho >= 0 && indexVizinho < produtosCategoria.length) {
                const vizinho = produtosCategoria[indexVizinho];
                const indexVizinhoGeral = produtosCarregados.findIndex(p => p.id === vizinho.id);

                produtosCarregados[indexGeral] = vizinho;
                produtosCarregados[indexVizinhoGeral] = prodAtual;

                ordemAlterada = true;
                atualizarBotaoSalvarOrdem();
                renderizarListaProdutosAdmin();
            }
        };

        function atualizarBotaoSalvarOrdem() {
            const btn = document.getElementById("btn-salvar-ordem");
            if (btn) {
                if (ordemAlterada) {
                    btn.disabled = false;
                    btn.style.opacity = "1";
                    btn.style.cursor = "pointer";
                    btn.innerText = "💾 Salvar Nova Ordem";
                    btn.style.background = "#d4af37";
                    btn.style.color = "#000";
                } else {
                    btn.disabled = true;
                    btn.style.opacity = "0.5";
                    btn.style.cursor = "not-allowed";
                    btn.innerText = "✔️ Ordem Salva";
                    btn.style.background = "#25D366";
                    btn.style.color = "#fff";
                }
            }
        }

        const btnSalvarOrdem = document.getElementById("btn-salvar-ordem");
        if (btnSalvarOrdem) {
            btnSalvarOrdem.addEventListener("click", async () => {
                if (!ordemAlterada) return;

                btnSalvarOrdem.innerText = "Salvando...";
                btnSalvarOrdem.disabled = true;

                try {
                    const batch = writeBatch(db);

                    produtosCarregados.forEach((prod, index) => {
                        const novaOrdem = index * 10;
                        prod.ordem = novaOrdem;
                        batch.update(doc(db, "produtos", prod.id), { ordem: novaOrdem });
                    });

                    await batch.commit();
                    invalidarCacheLoja();

                    ordemAlterada = false;
                    atualizarBotaoSalvarOrdem();
                } catch (error) {
                    console.error("Erro ao salvar ordem:", error);
                    alert("Erro ao salvar a nova ordem no banco.");
                    btnSalvarOrdem.innerText = "Tentar Novamente";
                    btnSalvarOrdem.disabled = false;
                }
            });
        }

        window.carregarParaEdicao = function (id) {
            const prod = produtosCarregados.find(p => p.id === id);
            if (!prod) return;

            document.getElementById("titulo").value = prod.titulo;
            document.getElementById("precoNum").value = prod.precoNum;
            document.getElementById("categoria").value = prod.categoria;

            let filtrosClean = prod.filtros ? prod.filtros.filter(f => f !== "todos").join(", ") : "";
            document.getElementById("filtros").value = filtrosClean;

            document.getElementById("tamanhos").value = prod.tamanhos || "";
            document.getElementById("descricao").value = prod.descricao || "";

            listaFotos = [...(prod.fotos || [])];
            renderizarPreview();

            produtoEditandoId = id;
            btnSalvar.innerText = "🔄 Atualizar Produto";
            window.scrollTo({ top: 0, behavior: 'smooth' });

            document.getElementById("status").innerText = "Modo de edição ativado. Faça as alterações e clique em Atualizar.";
            document.getElementById("status").style.color = "#d4af37";
        };

        window.deletarProduto = async function (id) {
            if (confirm("Tem certeza que deseja excluir este produto da loja? Esta ação não pode ser desfeita.")) {
                try {
                    await deleteDoc(doc(db, "produtos", id));
                    invalidarCacheLoja();
                    alert("Produto excluído com sucesso!");
                    carregarProdutosAdmin();
                } catch (err) {
                    alert("Erro ao excluir: " + err.message);
                }
            }
        };
    </script>
</body>

</html>
