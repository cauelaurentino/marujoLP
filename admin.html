<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Use Marujo</title>
    <!-- Use Google Fonts to match the main site -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Base Styles & CSS Variables */
        :root {
            --primary: #d4af37;
            --primary-hover: #f1c40f;
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --bg-input: #2b2b2b;
            --text-main: #f5f5f5;
            --text-muted: #aaaaaa;
            --border-color: #333;
            --danger: #ff4d4d;
            --success: #25D366;
            --font-main: 'Poppins', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        /* Top Bar */
        .admin-header {
            max-width: 1000px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--bg-panel);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .admin-header h1 {
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Common Container Styles */
        .admin-container {
            max-width: 1000px;
            margin: 0 auto 40px;
            padding: 30px;
            background: var(--bg-panel);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .admin-container h2 {
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        /* Form Layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--bg-dark);
            width: 100%;
            margin-top: 20px;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: rgba(255, 77, 77, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: #fff;
        }
        
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            width: 100%;
        }
        
        .btn-outline:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        /* Photo Upload Area */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background: rgba(255,255,255,0.02);
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(212, 175, 55, 0.05);
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .foto-preview-card {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .foto-preview-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .foto-tag {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .foto-acoes {
            display: flex;
            justify-content: space-between;
            gap: 5px;
            margin-top: auto;
        }

        .foto-acoes button {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .foto-acoes button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .foto-acoes .btn-remove:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(255, 77, 77, 0.1);
        }

        /* Product Management Lists */
        .categoria-section {
            margin-bottom: 40px;
        }

        .categoria-section h3 {
            color: var(--text-main);
            font-size: 1.2rem;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid var(--primary);
        }

        .admin-carrossel {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .admin-card {
            background: var(--bg-input);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .admin-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .admin-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
        }

        .admin-card-info {
            padding: 15px;
        }

        .admin-card-info h4 {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .admin-card-info p {
            color: var(--primary);
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .badge-loja {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 500;
            color: white;
        }
        
        .badge-fem { background: #E05D84; }
        .badge-masc { background: #444; }

        .admin-card-acoes {
            display: flex;
            padding: 0 15px 15px;
            gap: 10px;
        }

        .btn-acao {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .btn-editar {
            background: rgba(212, 175, 55, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-editar:hover {
            background: var(--primary);
            color: var(--bg-dark);
        }

        .btn-excluir {
            background: rgba(255, 77, 77, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
            flex: 0 0 40px;
        }

        .btn-excluir:hover {
            background: var(--danger);
            color: white;
        }

        .admin-card-ordem {
            display: flex;
            border-top: 1px solid var(--border-color);
        }

        .admin-card-ordem button {
            flex: 1;
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .admin-card-ordem button:hover:not([disabled]) {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
        }
        
        .admin-card-ordem button:first-child { border-right: 1px solid var(--border-color); }

        /* Login Box specific */
        .login-box {
            max-width: 400px;
            margin: 10vh auto;
            text-align: center;
        }
        
        .login-box h2 {
            justify-content: center;
            border: none;
            margin-bottom: 30px;
        }

        /* Status Messages */
        .status-msg {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            display: none; /* Hidden by default */
        }
        
        .status-msg.active {
            display: block;
        }

        /* Responsiveness */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .admin-container {
                padding: 20px 15px;
                margin-bottom: 20px;
            }
            
            .admin-carrossel {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 15px;
            }
            
            .admin-card img {
                height: 160px;
            }
        }
    </style>
</head>
<body>
    <!-- ========================================== -->
    <!-- 1. TELA DE LOGIN (Exibida quando NÃO autenticado) -->
    <!-- ========================================== -->
    <div id="painel-login" class="admin-container login-box">
        <h2><i class="fa-solid fa-lock"></i> Acesso Restrito</h2>
        <form id="form-login">
            <div class="form-group">
                <input type="email" id="login-email" required placeholder="E-mail do Administrador">
            </div>
            <div class="form-group">
                <input type="password" id="login-senha" required placeholder="Senha">
            </div>
            <button type="submit" id="btn-entrar" class="btn btn-primary">
                Entrar no Painel
            </button>
            <p id="login-erro" style="color: var(--danger); margin-top: 15px; font-size: 0.9rem;"></p>
        </form>
    </div>

    <!-- ========================================== -->
    <!-- 2. PAINEL ADMIN (Exibido APENAS quando autenticado) -->
    <!-- ========================================== -->
    <div id="painel-admin" style="display: none;">
        
        <div class="admin-header">
            <h1><i class="fa-solid fa-anchor"></i> USE MARUJO</h1>
            <button id="btn-logout" class="btn btn-danger" style="padding: 8px 15px; font-size: 0.9rem;">
                <i class="fa-solid fa-right-from-bracket"></i> Sair
            </button>
        </div>

        <!-- Formulário de Cadastro e Edição -->
        <div class="admin-container">
            <h2 id="form-titulo-main"><i class="fa-solid fa-circle-plus"></i> Cadastrar Produto</h2>
            <form id="admin-form">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Título do Produto</label>
                        <input type="text" id="titulo" placeholder="Ex: Camisa Dior Cinza" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Preço (R$)</label>
                        <input type="number" step="0.01" id="precoNum" placeholder="Ex: 79.90" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Loja de Destino</label>
                        <select id="loja_destino" required>
                            <option value="principal">Loja Principal (Masculina)</option>
                            <option value="feminina">Loja Feminina</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Categoria</label>
                        <select id="categoria" required>
                            <option value="camisas">Camisas</option>
                            <option value="blusas">Casacos e Blusas</option>
                            <option value="calcasebermudas">Calças e Bermudas</option>
                            <option value="moda-infantil">Moda Infantil</option>
                            <option value="roupas-femininas">Roupas Femininas</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Tamanhos Disponíveis</label>
                        <input type="text" id="tamanhos" placeholder="Ex: P, M, G, GG">
                    </div>
                    
                    <div class="form-group full-width">
                        <label>Filtros / Tags (separados por vírgula)</label>
                        <input type="text" id="filtros" placeholder="Ex: dior, lançamento">
                    </div>

                    <div class="form-group full-width">
                        <label>Descrição Detalhada</label>
                        <textarea id="descricao" rows="4" placeholder="Fale um pouco sobre o tecido, modelagem, caimento..."></textarea>
                    </div>
                    
                    <div class="form-group full-width">
                        <label>Fotos do Produto (Máximo 5 fotos)</label>
                        <div class="upload-area">
                            <input type="file" id="fotos-input" accept="image/*" multiple style="display: none;">
                            <button type="button" id="btn-add-foto" class="btn btn-outline">
                                <i class="fa-solid fa-cloud-arrow-up"></i> Clique para selecionar imagens
                            </button>
                            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px;">Formatos aceitos: JPG, PNG. Otimização automática ativa.</p>
                        </div>
                        <div id="preview-container" class="preview-container"></div>
                    </div>
                </div>
                
                <button type="submit" id="btn-salvar" class="btn btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar no Firestore
                </button>
            </form>
            <div id="status" class="status-msg"></div>
        </div>

        <!-- Painel de Gerenciamento CRUD e Reordenação -->
        <div class="admin-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;">
                <h2 style="margin: 0; border: none; padding: 0;"><i class="fa-solid fa-boxes-stacked"></i> Produtos Cadastrados</h2>
                <button id="btn-salvar-ordem" class="btn" style="background: var(--success); color: white; cursor: not-allowed; opacity: 0.5;" disabled>
                    <i class="fa-solid fa-check"></i> Ordem Salva
                </button>
            </div>

            <div id="carrosseis-admin">
                <!-- Os carrosséis serão injetados aqui via JS -->
            </div>
        </div>
    </div>

    <!-- SCRIPT FIREBASE & LÓGICA DO PAINEL -->
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDhOdVX9pxPzOpfOJZfsfjfjh_N0AUPA9k",
        authDomain: "usemarujo-bb701.firebaseapp.com",
        projectId: "usemarujo-bb701",
        storageBucket: "usemarujo-bb701.firebasestorage.app",
        messagingSenderId: "268367201875",
        appId: "1:268367201875:web:368ca1268dcd4b92bfa8a6",
        measurementId: "G-5YTJTJC80L"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Função auxiliar para mostrar mensagens de status bonitas
    function showStatus(msg, type = 'success') {
        const statusEl = document.getElementById("status");
        statusEl.innerText = msg;
        statusEl.className = 'status-msg active';
        
        if (type === 'success') {
            statusEl.style.backgroundColor = 'rgba(37, 211, 102, 0.1)';
            statusEl.style.color = '#25D366';
            statusEl.style.border = '1px solid #25D366';
        } else if (type === 'error') {
            statusEl.style.backgroundColor = 'rgba(255, 77, 77, 0.1)';
            statusEl.style.color = '#ff4d4d';
            statusEl.style.border = '1px solid #ff4d4d';
        } else {
            statusEl.style.backgroundColor = 'rgba(212, 175, 55, 0.1)';
            statusEl.style.color = '#d4af37';
            statusEl.style.border = '1px solid #d4af37';
        }
    }

    function hideStatus() {
        const statusEl = document.getElementById("status");
        statusEl.className = 'status-msg';
    }

    function invalidarCacheLoja() {
        localStorage.removeItem("usemarujo_produtos_cache");
        localStorage.removeItem("usemarujo_produtos_time");
    }

    // ==========================================
    // SISTEMA DE LOGIN E SEGURANÇA DA TELA
    // ==========================================
    const painelLogin = document.getElementById("painel-login");
    const painelAdmin = document.getElementById("painel-admin");
    const formLogin = document.getElementById("form-login");
    const loginErro = document.getElementById("login-erro");
    const btnLogout = document.getElementById("btn-logout");

    onAuthStateChanged(auth, (user) => {
        if (user) {
            painelLogin.style.display = "none";
            painelAdmin.style.display = "block";
            carregarProdutosAdmin();
        } else {
            painelLogin.style.display = "block";
            painelAdmin.style.display = "none";
        }
    });

    if (formLogin) {
        formLogin.addEventListener("submit", async (e) => {
            e.preventDefault();
            const btnEntrar = document.getElementById("btn-entrar");
            const btnText = btnEntrar.innerText;
            
            loginErro.innerText = "";
            btnEntrar.innerText = "Verificando...";
            btnEntrar.disabled = true;
            
            const email = document.getElementById("login-email").value;
            const senha = document.getElementById("login-senha").value;

            try {
                await signInWithEmailAndPassword(auth, email, senha);
                formLogin.reset();
            } catch (error) {
                console.error("Erro ao entrar:", error);
                loginErro.innerText = "E-mail ou senha incorretos.";
            } finally {
                btnEntrar.innerText = btnText;
                btnEntrar.disabled = false;
            }
        });
    }

    if (btnLogout) {
        btnLogout.addEventListener("click", () => signOut(auth));
    }

    // ==========================================
    // VARIÁVEIS GLOBAIS
    // ==========================================
    let listaFotosBase64 = [];
    let produtoEditandoId = null;
    let produtosCarregados = [];
    let ordemAlterada = false;

    const fotosInput = document.getElementById("fotos-input");
    const btnAddFoto = document.getElementById("btn-add-foto");
    const previewContainer = document.getElementById("preview-container");
    const form = document.getElementById("admin-form");
    const btnSalvar = document.getElementById("btn-salvar");

    // ==========================================
    // COMPRESSÃO E PROCESSAMENTO EM BASE64
    // ==========================================
    btnAddFoto.addEventListener("click", () => fotosInput.click());

    function compressAndConvertToBase64(file, maxWidth = 600, quality = 0.6) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    resolve(canvas.toDataURL('image/webp', quality));
                };
                img.onerror = () => reject(new Error("Erro ao processar imagem."));
            };
            reader.onerror = () => reject(new Error("Erro ao ler arquivo."));
        });
    }

    fotosInput.addEventListener("change", async (e) => {
        const files = Array.from(e.target.files);

        if (listaFotosBase64.length + files.length > 5) {
            alert("Atenção: O limite máximo é de 5 fotos por produto.");
            fotosInput.value = "";
            return;
        }

        if (files.length > 0) {
            showStatus(`Otimizando ${files.length} foto(s)... aguarde.`, 'info');
            btnAddFoto.disabled = true;
            
            try {
                for (let i = 0; i < files.length; i++) {
                    const base64 = await compressAndConvertToBase64(files[i]);
                    listaFotosBase64.push(base64);
                }
                hideStatus();
                renderizarPreview();
            } catch (err) {
                showStatus("Erro ao processar imagens.", 'error');
            } finally {
                fotosInput.value = "";
                btnAddFoto.disabled = false;
            }
        }
    });

    function renderizarPreview() {
        previewContainer.innerHTML = "";
        listaFotosBase64.forEach((foto, index) => {
            const card = document.createElement("div");
            card.className = "foto-preview-card";
            card.innerHTML = `
                <div class="foto-tag">${index === 0 ? "1ª (Capa)" : `${index + 1}ª Foto`}</div>
                <img src="${foto}" alt="Foto ${index + 1}">
                <div class="foto-acoes">
                    <button type="button" onclick="moverFotoForm(${index}, -1)" ${index === 0 ? 'disabled style="opacity:0.3"' : ''} title="Mover para esquerda"><i class="fa-solid fa-chevron-left"></i></button>
                    <button type="button" class="btn-remove" onclick="removerFotoForm(${index})" title="Remover"><i class="fa-solid fa-trash"></i></button>
                    <button type="button" onclick="moverFotoForm(${index}, 1)" ${index === listaFotosBase64.length - 1 ? 'disabled style="opacity:0.3"' : ''} title="Mover para direita"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            `;
            previewContainer.appendChild(card);
        });
    }

    window.moverFotoForm = function (index, direcao) {
        const novoIndex = index + direcao;
        if (novoIndex >= 0 && novoIndex < listaFotosBase64.length) {
            const itemRemovido = listaFotosBase64.splice(index, 1)[0];
            listaFotosBase64.splice(novoIndex, 0, itemRemovido);
            renderizarPreview();
        }
    };

    window.removerFotoForm = function (index) {
        listaFotosBase64.splice(index, 1);
        renderizarPreview();
    };

    // ==========================================
    // SALVAR OU ATUALIZAR PRODUTO NO FIRESTORE
    // ==========================================
    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (listaFotosBase64.length === 0) {
            showStatus("Adicione pelo menos 1 foto para o produto.", 'error');
            return;
        }

        btnSalvar.disabled = true;
        const textoOriginal = btnSalvar.innerHTML;
        btnSalvar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvando...';
        showStatus(produtoEditandoId ? "Atualizando produto..." : "Salvando novo produto...", 'info');

        try {
            const titulo = document.getElementById("titulo").value;
            const precoVal = parseFloat(document.getElementById("precoNum").value);
            const categoria = document.getElementById("categoria").value;
            const lojaDestino = document.getElementById("loja_destino").value;
            const descricao = document.getElementById("descricao").value;
            const tamanhos = document.getElementById("tamanhos").value;
            const rawFiltros = document.getElementById("filtros").value.split(",").map(f => f.trim().toLowerCase()).filter(f => f);
            const filtros = ["todos", ...rawFiltros];

            const produtoDados = {
                titulo,
                precoNum: precoVal,
                preco: `R$ ${precoVal.toFixed(2).replace(".", ",")}`,
                categoria,
                loja: lojaDestino,
                filtros,
                descricao,
                tamanhos,
                fotos: listaFotosBase64,
                mensagemZap: `Olá! Tenho interesse no(a) ${titulo} que vi no site da Use Marujo.`
            };

            if (produtoEditandoId) {
                await updateDoc(doc(db, "produtos", produtoEditandoId), produtoDados);
                showStatus("Produto atualizado com sucesso!", 'success');
                produtoEditandoId = null;
                btnSalvar.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Salvar no Firestore';
                document.getElementById("form-titulo-main").innerHTML = '<i class="fa-solid fa-circle-plus"></i> Cadastrar Produto';
            } else {
                produtoDados.criadoEm = new Date();
                produtoDados.ordem = Date.now();
                await addDoc(collection(db, "produtos"), produtoDados);
                showStatus("Produto cadastrado com sucesso!", 'success');
            }

            invalidarCacheLoja();
            form.reset();
            listaFotosBase64 = [];
            renderizarPreview();
            
            // Retorna seletor de categorias para o estado inicial
            document.getElementById("loja_destino").dispatchEvent(new Event('change'));
            
            carregarProdutosAdmin();
            
            setTimeout(hideStatus, 5000);
        } catch (err) {
            console.error(err);
            showStatus("Erro: " + err.message, 'error');
        } finally {
            btnSalvar.disabled = false;
            if(!produtoEditandoId) btnSalvar.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Salvar no Firestore';
        }
    });

    // ==========================================
    // LISTAGEM, EDIÇÃO, EXCLUSÃO E ORDENAÇÃO
    // ==========================================
    async function carregarProdutosAdmin() {
        const carrosseisDiv = document.getElementById("carrosseis-admin");
        carrosseisDiv.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--primary);"><i class="fa-solid fa-circle-notch fa-spin fa-2x"></i><p style="margin-top: 10px;">Carregando produtos...</p></div>';

        try {
            const querySnapshot = await getDocs(collection(db, "produtos"));
            produtosCarregados = [];
            
            querySnapshot.forEach((docSnap) => {
                produtosCarregados.push({ id: docSnap.id, ...docSnap.data() });
            });

            produtosCarregados.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
            ordemAlterada = false;
            atualizarBotaoSalvarOrdem();
            renderizarListaProdutosAdmin();
        } catch (error) {
            console.error("Erro ao carregar lista:", error);
            carrosseisDiv.innerHTML = `<div style="text-align: center; padding: 20px; color: var(--danger);"><i class="fa-solid fa-circle-exclamation fa-2x"></i><p>Erro ao carregar produtos. Verifique sua conexão ou permissões do Firebase.</p></div>`;
        }
    }

    function renderizarListaProdutosAdmin() {
        const carrosseisDiv = document.getElementById("carrosseis-admin");
        carrosseisDiv.innerHTML = "";
        
        if (produtosCarregados.length === 0) {
            carrosseisDiv.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted);"><p>Nenhum produto cadastrado ainda.</p></div>';
            return;
        }

        const categoriasFiltro = {
            "camisas": "Camisas",
            "blusas": "Casacos e Blusas",
            "calcasebermudas": "Calças e Bermudas",
            "moda-infantil": "Moda Infantil",
            "roupas-femininas": "Roupas Femininas",
            "academia": "Academia (Fem)",
            "vestidos": "Vestidos (Fem)",
            "conjuntos": "Conjuntos (Fem)",
            "calcas": "Calças (Fem)",
            "saias": "Saias e Shorts (Fem)"
        };

        Object.keys(categoriasFiltro).forEach(catId => {
            const produtosCategoria = produtosCarregados.filter(p => p.categoria === catId);
            
            if (produtosCategoria.length > 0) {
                const sec = document.createElement("div");
                sec.className = "categoria-section";
                
                let cardsHTML = produtosCategoria.map((p, index) => {
                    const imagemCapa = (p.fotos && p.fotos.length > 0) ? p.fotos[0] : "https://via.placeholder.com/200x200?text=Sem+Foto";
                    const tituloProd = p.titulo || "Sem título";
                    const precoProd = p.preco || "R$ 0,00";
                    const badge = p.loja === "feminina" 
                        ? '<span class="badge-loja badge-fem">Feminina</span>' 
                        : '<span class="badge-loja badge-masc">Principal</span>';

                    return `
                        <div class="admin-card">
                            <img src="${imagemCapa}" alt="${tituloProd}" loading="lazy">
                            <div class="admin-card-info">
                                <h4>${tituloProd}</h4>
                                <p>${precoProd} ${badge}</p>
                            </div>
                            <div class="admin-card-acoes">
                                <button type="button" class="btn-acao btn-editar" onclick="carregarParaEdicao('${p.id}')">
                                    <i class="fas fa-edit"></i> Editar
                                </button>
                                <button type="button" class="btn-acao btn-excluir" onclick="deletarProduto('${p.id}')" title="Excluir">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                            <div class="admin-card-ordem">
                                <button type="button" onclick="moverPosicaoProdutoLocal('${p.id}', -1)" ${index === 0 ? 'disabled style="opacity: 0.2"' : ''} title="Mover para esquerda">
                                    <i class="fa-solid fa-arrow-left"></i>
                                </button>
                                <button type="button" onclick="moverPosicaoProdutoLocal('${p.id}', 1)" ${index === produtosCategoria.length - 1 ? 'disabled style="opacity: 0.2"' : ''} title="Mover para direita">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');

                sec.innerHTML = `
                    <h3>${categoriasFiltro[catId]}</h3>
                    <div class="admin-carrossel">
                        ${cardsHTML}
                    </div>
                `;
                carrosseisDiv.appendChild(sec);
            }
        });
    }

    window.moverPosicaoProdutoLocal = function(produtoId, direcao) {
        const indexGeral = produtosCarregados.findIndex(p => p.id === produtoId);
        if (indexGeral === -1) return;
        
        const prodAtual = produtosCarregados[indexGeral];
        const produtosCategoria = produtosCarregados.filter(p => p.categoria === prodAtual.categoria);
        const indexNaCategoria = produtosCategoria.findIndex(p => p.id === produtoId);
        const indexVizinho = indexNaCategoria + direcao;
        
        if (indexVizinho >= 0 && indexVizinho < produtosCategoria.length) {
            const vizinho = produtosCategoria[indexVizinho];
            const indexVizinhoGeral = produtosCarregados.findIndex(p => p.id === vizinho.id);

            produtosCarregados[indexGeral] = vizinho;
            produtosCarregados[indexVizinhoGeral] = prodAtual;

            ordemAlterada = true;
            atualizarBotaoSalvarOrdem();
            renderizarListaProdutosAdmin();
        }
    };

    function atualizarBotaoSalvarOrdem() {
        const btn = document.getElementById("btn-salvar-ordem");
        if (btn) {
            if (ordemAlterada) {
                btn.disabled = false;
                btn.style.opacity = "1";
                btn.style.cursor = "pointer";
                btn.innerHTML = "<i class='fa-solid fa-floppy-disk'></i> Salvar Nova Ordem";
                btn.style.background = "var(--primary)";
                btn.style.color = "var(--bg-dark)";
            } else {
                btn.disabled = true;
                btn.style.opacity = "0.5";
                btn.style.cursor = "not-allowed";
                btn.innerHTML = "<i class='fa-solid fa-check'></i> Ordem Salva";
                btn.style.background = "var(--success)";
                btn.style.color = "white";
            }
        }
    }

    const btnSalvarOrdem = document.getElementById("btn-salvar-ordem");
    if(btnSalvarOrdem) {
        btnSalvarOrdem.addEventListener("click", async () => {
            if (!ordemAlterada) return;

            btnSalvarOrdem.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Salvando...";
            btnSalvarOrdem.disabled = true;

            try {
                const batch = writeBatch(db);
                
                produtosCarregados.forEach((prod, index) => {
                    const novaOrdem = index * 10; 
                    prod.ordem = novaOrdem;
                    batch.update(doc(db, "produtos", prod.id), { ordem: novaOrdem });
                });

                await batch.commit();
                invalidarCacheLoja();
                
                ordemAlterada = false;
                atualizarBotaoSalvarOrdem();
                showStatus("Nova ordem salva com sucesso!", 'success');
                setTimeout(hideStatus, 3000);
            } catch (error) {
                console.error("Erro ao salvar ordem:", error);
                alert("Erro ao salvar a nova ordem no banco.");
                atualizarBotaoSalvarOrdem();
            }
        });
    }

    window.carregarParaEdicao = function (id) {
        const prod = produtosCarregados.find(p => p.id === id);
        if (!prod) return;

        document.getElementById("titulo").value = prod.titulo;
        document.getElementById("precoNum").value = prod.precoNum;
        
        // Configura a loja primeiro para as categorias atualizarem
        const lojaSelect = document.getElementById("loja_destino");
        lojaSelect.value = prod.loja || "principal";
        lojaSelect.dispatchEvent(new Event('change'));
        
        // Um pequeno delay para garantir que as opções da categoria foram recriadas
        setTimeout(() => {
            document.getElementById("categoria").value = prod.categoria;
        }, 50);
        
        let filtrosClean = prod.filtros ? prod.filtros.filter(f => f !== "todos").join(", ") : "";
        document.getElementById("filtros").value = filtrosClean;
        
        document.getElementById("tamanhos").value = prod.tamanhos || "";
        document.getElementById("descricao").value = prod.descricao || "";

        listaFotosBase64 = [...(prod.fotos || [])];
        renderizarPreview();

        produtoEditandoId = id;
        
        const btnSalvar = document.getElementById("btn-salvar");
        btnSalvar.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Atualizar Produto';
        
        const tituloMain = document.getElementById("form-titulo-main");
        tituloMain.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Editando: ' + prod.titulo;
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showStatus("Modo de edição ativado.", 'info');
    };

    window.deletarProduto = async function (id) {
        if (confirm("Tem certeza que deseja excluir este produto da loja? Esta ação NÃO pode ser desfeita.")) {
            try {
                await deleteDoc(doc(db, "produtos", id));
                invalidarCacheLoja();
                showStatus("Produto excluído com sucesso!", 'success');
                carregarProdutosAdmin();
                setTimeout(hideStatus, 3000);
            } catch (err) {
                alert("Erro ao excluir: " + err.message);
            }
        }
    };

    // ==========================================
    // SELETOR DE CATEGORIAS DINÂMICO
    // ==========================================
    document.addEventListener("DOMContentLoaded", function () {
        const lojaSelect = document.getElementById("loja_destino");
        const categoriaSelect = document.getElementById("categoria");

        const categoriasPrincipal = [
            { value: "camisas", text: "Camisas" },
            { value: "blusas", text: "Casacos e Blusas" },
            { value: "calcasebermudas", text: "Calças e Bermudas" },
            { value: "moda-infantil", text: "Moda Infantil" },
            { value: "roupas-femininas", text: "Roupas Femininas" }
        ];

        const categoriasFeminina = [
            { value: "academia", text: "Academia" },
            { value: "blusas", text: "Blusas" },
            { value: "vestidos", text: "Vestidos" },
            { value: "conjuntos", text: "Conjuntos" },
            { value: "calcas", text: "Calças" }, 
            { value: "saias", text: "Saias e Shorts" }
        ];

        function atualizarCategorias() {
            if (!lojaSelect || !categoriaSelect) return;

            const lojaSelecionadaValor = lojaSelect.value;
            
            // Salva o valor atual caso exista
            const valorAtual = categoriaSelect.value;
            
            categoriaSelect.innerHTML = ""; 

            const categoriasParaMostrar = lojaSelecionadaValor === "feminina" ? categoriasFeminina : categoriasPrincipal;

            categoriasParaMostrar.forEach(cat => {
                const option = document.createElement("option");
                option.value = cat.value;
                option.textContent = cat.text;
                categoriaSelect.appendChild(option);
            });
            
            // Tenta manter a seleção se a opção ainda existir
            if (valorAtual) {
                const existe = Array.from(categoriaSelect.options).some(opt => opt.value === valorAtual);
                if (existe) categoriaSelect.value = valorAtual;
            }
        }

        if (lojaSelect) {
            setTimeout(atualizarCategorias, 100);
            lojaSelect.addEventListener("change", atualizarCategorias);
        }
    });
    </script>
</body>
</html>
