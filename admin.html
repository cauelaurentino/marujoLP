<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Use Marujo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 600px;
            margin: 100px auto 40px;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #d4af37;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #d4af37;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }

        .status-msg {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="admin-container">
        <h2><i class="fa-solid fa-anchor"></i> Cadastrar Novo Produto</h2>
        <form id="admin-form">
            <div class="form-group">
                <label>Título do Produto</label>
                <input type="text" id="titulo" placeholder="Ex: Camisa Dior Cinza" required>
            </div>

            <div class="form-group">
                <label>Preço (R$)</label>
                <input type="number" step="0.01" id="precoNum" placeholder="Ex: 79.90" required>
            </div>

            <div class="form-group">
                <label>Categoria</label>
                <select id="categoria" required>
                    <option value="camisas">Camisas</option>
                    <option value="blusas">Casacos e Blusas</option>
                    <option value="calcasebermudas">Calças e Bermudas</option>
                    <option value="moda-infantil">Moda Infantil</option>
                </select>
            </div>

            <div class="form-group">
                <label>Filtros / Tags (separados por vírgula)</label>
                <input type="text" id="filtros" placeholder="Ex: dior, lançamento">
            </div>

            <div class="form-group">
                <label>Tamanhos Disponíveis</label>
                <input type="text" id="tamanhos" placeholder="Ex: P, M, G, GG">
            </div>

            <div class="form-group">
                <label>Descrição</label>
                <textarea id="descricao" rows="3" placeholder="Descrição detalhada do produto..."></textarea>
            </div>

            <div class="form-group">
                <label>Fotos do Produto (Selecione uma ou mais)</label>
                <input type="file" id="fotos" multiple accept="image/*" required>
            </div>

            <button type="submit" id="btn-salvar" class="btn btn-gold btn-block">Salvar no Firestore</button>
        </form>
        <div id="status" class="status-msg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDhOdVX9pxPzOpfOJZfsfjfjh_N0AUPA9k",
            authDomain: "usemarujo-bb701.firebaseapp.com",
            projectId: "usemarujo-bb701",
            storageBucket: "usemarujo-bb701.firebasestorage.app",
            messagingSenderId: "268367201875",
            appId: "1:268367201875:web:368ca1268dcd4b92bfa8a6",
            measurementId: "G-5YTJTJC80L"
        };

        console.log("Inicializando Firebase com o projectID:", firebaseConfig.projectId);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function compressAndConvertToBase64(file, maxWidth = 700, quality = 0.55) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/webp', quality));
                    };
                    img.onerror = () => reject(new Error("Erro ao processar imagem"));
                };
                reader.onerror = () => reject(new Error("Erro ao ler arquivo local"));
            });
        }

        document.getElementById("admin-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const statusEl = document.getElementById("status");
            const btnSalvar = document.getElementById("btn-salvar");

            btnSalvar.disabled = true;
            statusEl.style.color = "#d4af37";

            try {
                const titulo = document.getElementById("titulo").value;
                const precoVal = parseFloat(document.getElementById("precoNum").value);
                const categoria = document.getElementById("categoria").value;
                const descricao = document.getElementById("descricao").value;
                const tamanhos = document.getElementById("tamanhos").value;
                const rawFiltros = document.getElementById("filtros").value.split(",").map(f => f.trim().toLowerCase()).filter(f => f);
                const filtros = ["todos", ...rawFiltros];

                const filesInput = document.getElementById("fotos").files;
                const fotosBase64 = [];

                for (let i = 0; i < filesInput.length; i++) {
                    statusEl.innerText = `Otimizando foto ${i + 1} de ${filesInput.length}...`;
                    const base64Foto = await compressAndConvertToBase64(filesInput[i]);
                    fotosBase64.push(base64Foto);
                }

                statusEl.innerText = "Conectando ao Firestore...";
                console.log("Tentando gravar dados no Firestore...");

                // Limite de tempo de 10 segundos para não travar infinitamente
                const timeoutPromise = new Promise((_, reject) =>
                    setTimeout(() => reject(new Error("Tempo esgotado. Verifique se o Firestore está criado no Console ou se o AdBlock está ativo.")), 10000)
                );

                const gravaçãoPromise = addDoc(collection(db, "produtos"), {
                    titulo,
                    precoNum: precoVal,
                    preco: `R$ ${precoVal.toFixed(2).replace(".", ",")}`,
                    categoria,
                    filtros,
                    descricao,
                    tamanhos,
                    fotos: fotosBase64,
                    mensagemZap: `Olá! Tenho interesse no(a) ${titulo} que vi no site da Use Marujo.`,
                    criadoEm: new Date()
                });

                await Promise.race([gravaçãoPromise, timeoutPromise]);

                statusEl.style.color = "#25D366";
                statusEl.innerText = "Produto cadastrado com sucesso!";
                document.getElementById("admin-form").reset();
            } catch (err) {
                console.error("ERRO COMPLETO DO FIREBASE:", err);
                statusEl.style.color = "#ff4d4d";
                statusEl.innerText = "Erro: " + err.message;
            } finally {
                btnSalvar.disabled = false;
            }
        });
    </script>
</body>

</html>
